function drawScene(){
 g.clearRect(0,0,202,187);g.fillStyle='#fff';g.fillRect(0,0,202,187);
 if(!campLoaded)return;
 const w=weather[state.weather],f=state.frame;
 g.drawImage(campArt,0,0);
 // Flame geometry is anchored to the logs in the reference art. Particle and fire strength respond to weather.
 const severity=w.kind==='storm'||w.rain>=70||w.snow>=70?0.43:(w.rain||w.snow)?0.70:1;
 const idx=Math.floor(f/1.5)%fireFrames.length;
 const fw=fireFrames[idx];
 if(fw.complete&&fw.naturalWidth){
  const width=29*severity,height=31*severity;
  const dx=101-width/2,dy=139-height+1;
  // V0.31 silhouette preserved. Only lower-right exposed boundary pixels are inked to separate white flame from white ground.
  // Both axes are anchored on the unchanged original log bed, no per-row distortion.
  g.imageSmoothingEnabled=false;
  const outW=Math.max(1,Math.round(width)),outH=Math.max(1,Math.round(height));
  const left=Math.round(101-outW/2),top=Math.round(140-outH);
  g.drawImage(fw,left,top,outW,outH);
 }
 // Sparse embers, each strictly 1–3 pixels total. No circular blobs or opacity/greys.
 if(severity>=.7){
   const count=severity===1?5:2;
   for(let i=0;i<count;i++){
     const age=(f*1.15+i*9.4)%32;
     const px=101+(rand(i+91)-.5)*16+Math.sin(f*.23+i*1.7)*2;
     const py=139-31*severity-2-age*.8;
     if(py<61||py>140)continue;
     const shape=i%3; // 1x1, 1x2, 2x1: pixel area never exceeds 2
     g.fillStyle=(i%4===0)?'#fff':'#000';
     g.fillRect(Math.round(px),Math.round(py),shape===2?2:1,shape===1?2:1);
   }
 }
 weatherLayer(w);
}

const packItems=['帐篷 / 地钉','睡袋 / 防潮垫','饮水 / 食物','头灯 / 电池','雨具 / 保暖衣','充电宝 / 数据线','垃圾袋','证件 / 钥匙'];
const virtualFiles=[{name:'露营笔记.txt',dir:'/',content:'HALO 营地笔记\n\n出发前确认天气及营地开放情况。\n傍晚搭好帐篷，收好地钉与拉绳。\n离开时带走全部垃圾。\n\n这是文件阅读器示例。\n可以在右侧导入自己的 UTF-8 文本文件。\n使用上下键或左右键翻页。'}, {name:'行程.md',dir:'/旅行',content:'# 周末露营\n\n09:00 出发\n11:00 到达营地\n12:00 午餐\n15:00 徒步\n18:00 返回营地\n\n第二天\n08:00 早餐\n10:00 收拾装备\n11:00 返程'}, {name:'天气记录.csv',dir:'/旅行',content:'城市,天气,温度\n上海,晴朗,23.6\n杭州,多云,21.8\n南京,小雨,18.2\n\n以上为演示数据。'}];
function announce(msg){document.querySelector('#live').textContent=msg}
function shortName(s){return Array.from(s).slice(0,4).join('')}
function fit(s,max,size=14){ctx.font=`${size}px system-ui`;let a=Array.from(String(s));while(a.length&&ctx.measureText(a.join('')).width>max)a.pop();return a.length<Array.from(String(s)).length?a.join('')+'…':a.join('')}
function go(page){state.stack.push({page:state.page,selected:state.selected,folder:state.folder});state.page=page;state.selected=0;render()}
function back(){const p=state.stack.pop();if(p)Object.assign(state,p);else{state.page='home';state.selected=0}render()}
function duration(ms){let sec=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function elapsed(){return stopwatch.elapsed+(stopwatch.running?Date.now()-stopwatch.start:0)}
function remaining(t){return t.running?Math.max(0,t.end-Date.now()):t.remaining}
function toggleTimer(t){if(t.running){t.remaining=remaining(t);t.running=false}else if(t.remaining>0){t.end=Date.now()+t.remaining;t.running=true}render()}
function tick(){for(const [t,name] of [[countdown,'倒计时结束'],[pomodoro,'番茄钟阶段完成']]){if(t.running&&Date.now()>=t.end){t.running=false;t.remaining=0;if(t===pomodoro){if(t.phase==='focus'){t.rounds++;t.phase=t.rounds%4===0?'long':'break'}else t.phase='focus';t.remaining=(t.phase==='focus'?prefs.focus:t.phase==='long'?15:5)*60000;announce(name+'，请按开始进入下一阶段。')}else announce(name+'。')}}}
// All list entries use one-bit pictograms, including nested settings and file rows.

 if(['wifi','folder','tools'].includes(kind)){icon(['wifi','folder','tools'].indexOf(kind),x,y,c);return}
 const glyph={clock:['0111110','1100011','1001001','1001101','1000001','1100011','0111110'],calendar:['0100010','1111111','1000001','1111111','1010101','1010101','1111111'],monitor:['1111111','1000001','1010101','1001001','1111111','0001000','0011100'],settings:['0011100','0101010','1100011','1011101','1100011','0101010','0011100'],check:['1111111','1000001','1000011','1100101','1011001','1000001','1111111'],file:['1111100','1000110','1010101','1000001','1011101','1000001','1111111'],home:['0001000','0011100','0111110','1100011','0101010','0101010','0111110']}[kind]||['0011100','0100010','0000100','0001000','0001000','0000000','0001000'];
 glyph.forEach((row,j)=>[...row].forEach((v,i)=>{if(v==='1')rect(x+i*2,y+j*2,2,2,c)}))
}
function topbar(){const w=weather[state.weather];rect(0,0,400,23);const cols=[['TEMP '+w.temp+'°C',0,91],['HUM '+w.rh+'%',91,68],['TIME '+beijing(),159,82],['BAT 87%',241,64],['WIFI '+(state.connected?shortName(prefs.ssid):'离线'),305,95]];cols.forEach(([value,x,width])=>{ctx.save();ctx.beginPath();ctx.rect(x+3,0,width-6,23);ctx.clip();text(value,x+5,15,10,false,'#fff');ctx.restore();if(x)rect(x,6,1,11,'#fff')})}

function title(s,sub=''){text(s,12,62,18,true);if(sub)text(fit(sub,170,10),219,60,10)}
function rowList(items){actions=items;const start=Math.floor(state.selected/6)*6;items.slice(start,start+6).forEach((item,j)=>{let i=start+j,y=73+j*33,c=i===state.selected?'#fff':'#000';rect(8,y,384,31,i===state.selected?'#000':'#fff');pict(item.icon,18,y+8,c);text(fit(item.name,325,15),43,y+22,15,true,c);hits.push({x:8,y,w:384,h:31,run:()=>{state.selected=i;item.run()}})});if(items.length>6)text(`${start+1}–${Math.min(start+6,items.length)} / ${items.length}`,300,277,10)}
function button(label,x,y,w,run,index){const selected=state.selected===index;rect(x,y,w,28,selected?'#000':'#fff');ctx.strokeStyle='#000';ctx.strokeRect(x+.5,y+.5,w-1,27);text(label,x+8,y+19,13,true,selected?'#fff':'#000');hits.push({x,y,w,h:28,run});actions.push({run})}
function menuItem(name,icon,page){return{name,icon,run:()=>go(page)}}
function home(){drawScene();ctx.imageSmoothingEnabled=false;ctx.drawImage(scene,196,34,202,187);text('BEIJING / 北京时间',12,46,11,true);text(beijing(),9,101,59,true);text(new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',weekday:'short'}).format(new Date()),12,126,13);rect(12,139,172,1);text(weather[state.weather].name,12,178,25,true);text(prefs.city+' · 天气模拟',12,199,13);text(`${weather[state.weather].temp}°C  /  ${weather[state.weather].rh}%`,12,224,19,true);entries.forEach((e,i)=>{const x=8+i*130,c=i===state.selected?'#fff':'#000';rect(x,241,124,35,i===state.selected?'#000':'#fff');icon(i,x+14,251,c);text(e,x+36,264,15,true,c);const run=()=>go(['wifi','files','tools'][i]);actions.push({run});hits.push({x,y:241,w:124,h:35,run})})}
function wifi(){title('无线网络','模拟连接');text('SSID  '+fit(prefs.ssid,275),16,93,15,true);text('信号 -54 dBm  /  IP 192.168.1.42',16,122,13);text(state.connected?'连接正常 · 模拟':'连接已断开 · 模拟',16,152,15);text('北京时间：本机时钟 / Asia/Shanghai',16,181,13);text('天气：'+prefs.city+' / 演示数据',16,207,13);button(state.connected?'断开连接':'连接',12,240,112,()=>{state.connected=!state.connected;render()},0);button('同步演示',137,240,112,()=>announce(state.connected?'同步流程演示完成；当前时间仍来自本机，天气为模拟数据。':'请先连接模拟 Wi-Fi。'),1);button('城市设置',262,240,126,()=>go('cities'),2)}
function files(){title('文件管理',state.folder==='/'?'TF / 演示目录':state.folder);const items=[];if(state.folder==='/')items.push({name:'旅行',icon:'folder',run:()=>{go('files');state.folder='/旅行';render()}});virtualFiles.filter(f=>f.dir===state.folder).forEach(f=>items.push({name:f.name,icon:'file',run:()=>{state.file=f;state.filePage=0;go('reader')}}));rowList(items)}
function wrap(content){const result=[];ctx.font='14px system-ui';for(const raw of content.replace(/\r/g,'').split('\n')){let line='';for(const ch of raw.replace(/\t/g,'  ')){if(ctx.measureText(line+ch).width>370){result.push(line);line=''}line+=ch}result.push(line)}return result}
function reader(){const lines=wrap(state.file.content),pages=Math.max(1,Math.ceil(lines.length/8));state.filePage=Math.max(0,Math.min(pages-1,state.filePage));title(fit(state.file.name,235,18));lines.slice(state.filePage*8,state.filePage*8+8).forEach((s,i)=>text(s,13,88+i*22,14));text(`${state.filePage+1} / ${pages} 页 · 方向键翻页`,13,275,11);actions=[{run:()=>{state.filePage=(state.filePage+1)%pages;render()}}]}
function toolsPage(){title('工具箱','HALO / 实用工具');rowList([menuItem('计时工具','clock','timers'),menuItem('番茄时钟','clock','pomodoro'),menuItem('日历','calendar','calendar'),menuItem('设备监控','monitor','monitor'),menuItem('出行清单','check','packing')])}
function timers(){title('计时工具');rowList([menuItem('秒表 / 分段记录','clock','stopwatch'),menuItem('倒计时','clock','countdown')])}
function stopwatchPage(){title('秒表','可离开页面继续计时');text(duration(elapsed()),40,127,56,true);stopwatch.laps.slice(-3).forEach((v,i)=>text(`记录 ${Math.max(1,stopwatch.laps.length-2)+i}   ${duration(v)}`,18,163+i*22,14));button(stopwatch.running?'暂停':'开始',12,242,112,()=>{if(stopwatch.running){stopwatch.elapsed=elapsed();stopwatch.running=false}else{stopwatch.start=Date.now();stopwatch.running=true}render()},0);button('记圈',137,242,112,()=>{if(stopwatch.running)stopwatch.laps.push(elapsed());render()},1);button('重置',262,242,126,()=>{Object.assign(stopwatch,{running:false,elapsed:0,laps:[]});render()},2)}
function countdownPage(){title('倒计时',countdown.running?'运行中':'就绪 / 可调整');text(duration(remaining(countdown)),40,135,56,true);text('结束后在页面内提示；关闭页面不提醒',16,180,13);button(countdown.running?'暂停':'开始',12,242,88,()=>toggleTimer(countdown),0);button('−1 分',108,242,88,()=>adjustCountdown(-1),1);button('+1 分',204,242,88,()=>adjustCountdown(1),2);button('重置',300,242,88,()=>{Object.assign(countdown,{running:false,remaining:300000,total:300000});render()},3)}
function adjustCountdown(minutes){if(countdown.running){announce('请先暂停，再调整时长。');return}countdown.remaining=Math.max(60000,Math.min(5999000,countdown.remaining+minutes*60000));countdown.total=countdown.remaining;render()}

function pomoPage(){title('番茄时钟',`完成 ${pomodoro.rounds} 轮`);text(pomodoro.phase==='focus'?'专注时间':pomodoro.phase==='long'?'长休息':'短休息',16,94,19,true);text(duration(remaining(pomodoro)),40,153,56,true);text(`专注 ${prefs.focus} 分 / 休息 5 分 / 每 4 轮长休 15 分`,16,184,12);text('阶段结束后手动开始下一阶段',16,208,13);button(pomodoro.running?'暂停':'开始',12,242,112,()=>toggleTimer(pomodoro),0);button('重置本轮',137,242,112,()=>{pomodoro.running=false;pomodoro.remaining=(pomodoro.phase==='focus'?prefs.focus:pomodoro.phase==='long'?15:5)*60000;render()},1);button('时长设置',262,242,126,()=>go('settings'),2)}
function beijingDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).split('-').map(Number)}
function calendar(){const [yy,mm,dd]=beijingDate(),date=new Date(Date.UTC(yy,mm-1+state.calendarOffset,1)),year=date.getUTCFullYear(),month=date.getUTCMonth(),days=new Date(Date.UTC(year,month+1,0)).getUTCDate(),start=(date.getUTCDay()+6)%7;title(`${year} 年 ${month+1} 月`,'北京日期');['一','二','三','四','五','六','日'].forEach((v,i)=>text(v,25+i*54,88,13,true));for(let d=1;d<=days;d++){let index=start+d-1,x=16+index%7*54,y=99+Math.floor(index/7)*26,today=year===yy&&month===mm-1&&d===dd;if(today)rect(x,y,38,23);text(String(d),x+8,y+17,14,today,today?'#fff':'#000')}text('← → 月份   ↑ ↓ 年份   OK 回到今天',16,275,11)}
function monitor(){title('设备监控','全部为模拟指标');[['BAT','87% / 未充电'],['WIFI',state.connected?shortName(prefs.ssid)+' / -54 dBm':'未连接'],['MEM','可用 182 KB / 320 KB'],['TF','已用 2.1 GB / 16 GB'],['SENSOR',weather[state.weather].temp+'°C / '+weather[state.weather].rh+'%'],['UPTIME',duration(Date.now()-boot)+'（本页面）']].forEach(([a,b],i)=>{text(a,16,91+i*30,13,true);text(b,107,91+i*30,14)});actions=[]}
function packing(){title('出行清单',`${packItems.filter((_,i)=>prefs.checks[i]).length} / ${packItems.length} 已备齐`);rowList(packItems.map((name,i)=>({name:(prefs.checks[i]?'[已备] ':'[待备] ')+name,icon:'check',run:()=>{prefs.checks[i]=!prefs.checks[i];save();render()}})))}
function settings(){title('设置');rowList([{name:'天气城市 · '+prefs.city,icon:'settings',run:()=>go('cities')},{name:'营地动画 · '+(state.animated?'开':'关'),icon:'settings',run:()=>{state.animated=!state.animated;syncMotion();render()}},{name:'专注时长 · '+prefs.focus+' 分钟',icon:'clock',run:()=>{if(pomodoro.running){announce('请先暂停番茄钟再修改时长。');return}prefs.focus={25:45,45:50,50:25}[prefs.focus];if(pomodoro.phase==='focus')pomodoro.remaining=prefs.focus*60000;save();render()}},{name:'关于 HALO / 数据来源',icon:'monitor',run:()=>go('about')}])}
function setCity(city){if(!cities.includes(city))return;prefs.city=city;document.querySelector('#city').value=city;save();announce('天气城市已设为'+city+'；天气数值仍为模拟数据。');render()}
function cityPage(){title('天气城市','沪 / 苏 / 浙 / 皖');rowList(cities.map(city=>({name:city+(city===prefs.city?' · 已选':''),icon:'settings',run:()=>setCity(city)})))}
function about(){title('HALO / V0.28');['400 × 300 / 1-bit 动态交互原型','时间：本机时钟，按北京时间显示','天气 / Wi-Fi / 电量 / 传感器：模拟','文件：示例目录 + 本地导入，不上传','计时：真实计时；关闭页面无提醒','城市、专注时长、清单：浏览器保存'].forEach((s,i)=>text(s,14,94+i*29,13))}
const screens={home,menu:()=>{title('HALO / 菜单');rowList([menuItem('首页','home','home'),menuItem('无线网络','wifi','wifi'),menuItem('文件管理','folder','files'),menuItem('工具箱','tools','tools'),menuItem('设置','settings','settings')])},wifi,files,reader,tools:toolsPage,timers,stopwatch:stopwatchPage,countdown:countdownPage,pomodoro:pomoPage,calendar,monitor,packing,settings,cities:cityPage,about};
function render(){tick();hits=[];actions=[];rect(0,0,400,300,'#fff');topbar();(screens[state.page]||home)();rect(0,281,400,1);text('方向键选择  OK 确认  ESC 返回  M 菜单',10,295,10);text('HALO',363,295,9,true);binary();document.querySelectorAll('[data-weather]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.weather===state.weather)));canvas.setAttribute('aria-label',`HALO ${state.page}，北京时间 ${beijing()}，${prefs.city}，${weather[state.weather].name}，模拟天气。`)}
function setWeather(n){if(!Number.isInteger(n)||!weather[n])return;state.weather=n;render();announce(weather[n].name+' · 模拟场景已更新')}
function input(key){if(key==='Escape'){back();return}if(key.toLowerCase()==='m'){if(state.page==='menu')back();else go('menu');return}if(state.page==='calendar'){if(key==='Enter')state.calendarOffset=0;else state.calendarOffset+=({ArrowLeft:-1,ArrowRight:1,ArrowUp:-12,ArrowDown:12}[key]||0);render();return}if(state.page==='reader'&&key.startsWith('Arrow')){state.filePage+=['ArrowRight','ArrowDown'].includes(key)?1:-1;render();return}if(key.startsWith('Arrow')&&actions.length){state.selected=(state.selected+(['ArrowRight','ArrowDown'].includes(key)?1:actions.length-1))%actions.length;render()}else if(key==='Enter')actions[state.selected]?.run()}
const citySelect=document.querySelector('#city');Object.entries(cityGroups).forEach(([province,list])=>{const group=document.createElement('optgroup');group.label=province;list.forEach(city=>{const o=document.createElement('option');o.value=o.textContent=city;group.append(o)});citySelect.append(group)});citySelect.value=prefs.city;citySelect.onchange=e=>setCity(e.target.value);
const ssidInput=document.querySelector('#ssid');ssidInput.value=prefs.ssid;ssidInput.onchange=e=>{prefs.ssid=e.target.value.trim()||'HALO';save();render()};
document.querySelector('#files').onchange=async e=>{let imported=0;for(const f of e.target.files){if(f.size>512*1024||!(/\.(txt|md|csv|json|log)$/i.test(f.name))){announce('跳过 '+f.name+'：仅支持不超过 512 KB 的文本文件。');continue}try{virtualFiles.push({name:f.name,dir:'/导入',content:await f.text()});imported++}catch{announce('读取失败：'+f.name)}}if(imported){if(state.page!=='files')go('files');state.folder='/导入';state.selected=0;announce(`已导入 ${imported} 个本地文本，仅本次页面有效。`);render()}e.target.value=''};
// Imported files remain discoverable after leaving their folder.
const baseFiles=files;screens.files=()=>{baseFiles();if(state.folder==='/'&&virtualFiles.some(f=>f.dir==='/导入')){const existing=actions.slice();hits=[];rowList([...existing,{name:'导入文件',icon:'folder',run:()=>{go('files');state.folder='/导入';render()}}])}};
document.querySelectorAll('[data-weather]').forEach(b=>b.onclick=()=>setWeather(+b.dataset.weather));document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>input(b.dataset.key));document.addEventListener('keydown',e=>{if(e.target.matches('select,button,input,textarea'))return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Escape','m','M'].includes(e.key)){e.preventDefault();input(e.key)}});
canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*400/r.width,y=(e.clientY-r.top)*300/r.height;hits.find(h=>x>=h.x&&x<h.x+h.w&&y>=h.y&&y<h.y+h.h)?.run();canvas.focus()};
document.querySelector('#scale').onchange=e=>{canvas.style.width=e.target.value==='auto'?'100%':e.target.value+'px';canvas.style.maxWidth='100%'};
document.querySelector('#export').onclick=()=>{render();const a=document.createElement('a');a.download='halo-v028-'+state.page+'.png';a.href=canvas.toDataURL('image/png');a.click()};
document.querySelectorAll('[data-weather]').forEach(b=>b.addEventListener('focus',()=>b.scrollIntoView({block:'nearest'})));
const motionButton=document.querySelector('#motion');function syncMotion(){motionButton.textContent=state.animated?'暂停动画':'播放动画';motionButton.setAttribute('aria-pressed',String(state.animated))}motionButton.onclick=()=>{state.animated=!state.animated;syncMotion();render()};
syncMotion();render();setInterval(()=>{if(document.hidden)return;if(state.animated&&state.page==='home'){state.frame=(state.frame+1)%3360;render()}},1000/6);setInterval(()=>{tick();if(!document.hidden)render()},250);

</script></html>
